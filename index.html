<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuantum hesaplama · sıfırdan</title>
<style>
  :root {
    --bg: #f3efe6;
    --paper: #fbf8f2;
    --ink: #1c1915;
    --muted: #5c564c;
    --line: #e2d9cb;
    --side: #1c1915;
    --side-ink: #f3efe6;
    --side-dim: #b7aa98;
    --accent: #9a3412;
    --accent-soft: #f3e6dc;
    --ok: #1f6b45;
    --ok-soft: #e5f2eb;
    --lock: #8a8175;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  }
  button, input, select { font: inherit; }
  a { color: var(--accent); }
  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  aside {
    background: var(--side);
    color: var(--side-ink);
    padding: 22px 16px 32px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
  }
  .brand {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--side-dim);
    margin: 0 8px 8px;
  }
  aside h1 {
    font-size: 22px;
    line-height: 1.2;
    font-weight: 600;
    margin: 0 8px 14px;
  }
  .meter {
    margin: 0 8px 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--side-dim);
  }
  .bar {
    height: 4px;
    background: #3a342c;
    margin-top: 8px;
  }
  .bar > span {
    display: block;
    height: 100%;
    background: #e7c2ae;
    width: 0%;
  }
  .mod-label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--side-dim);
    margin: 18px 8px 6px;
  }
  .lesson-btn {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--side-ink);
    border: 0;
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
  }
  .lesson-btn:hover { background: #2a251f; }
  .lesson-btn.active { background: #342c24; }
  .lesson-btn:disabled {
    color: var(--lock);
    cursor: not-allowed;
  }
  .lesson-btn:disabled:hover { background: transparent; }
  .mark {
    width: 16px;
    height: 16px;
    margin-top: 3px;
    border: 1px solid #8d8070;
    border-radius: 3px;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    color: #d7efe3;
  }
  .lesson-btn.done .mark { background: var(--ok); border-color: var(--ok); }
  .ltitle { font-size: 15px; line-height: 1.3; }
  .lmeta {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    color: var(--side-dim);
    margin-top: 2px;
  }
  .lesson-btn:disabled .lmeta { color: #6f675e; }
  main { padding: 28px 32px 80px; max-width: 1180px; }
  .kicker {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  main h2 { font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 600; }
  .lead { color: var(--muted); margin: 0 0 16px; max-width: 68ch; }
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin: 0 0 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  .watch {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    padding-bottom: 8px;
    max-width: 920px;
  }
  .frame {
    background: #111;
    width: 100%;
    height: min(42vh, 420px);
  }
  .frame iframe, #player { width: 100%; height: 100%; }
  .now {
    margin-top: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 12px 14px 14px;
  }
  .now p { margin: 0; }
  .now-en {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.45;
  }
  .now-tr {
    margin-top: 8px;
    font-size: 18px;
    line-height: 1.45;
  }
  details.full {
    margin-top: 18px;
    max-width: 920px;
  }
  details.full summary {
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  .reading {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 18px 20px;
    max-width: 920px;
  }
  .note {
    margin: 14px 0 0;
    padding: 12px 14px;
    background: var(--accent-soft);
    max-width: 920px;
    font-size: 15px;
  }
  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 22px;
    align-items: start;
  }
  .col h3 {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 8px;
    color: var(--muted);
  }
  .cue {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 8px;
    padding: 8px 8px;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .cue time {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    color: var(--muted);
    padding-top: 3px;
  }
  .cue.active { background: #fff4ea; }
  .check {
    margin-top: 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 16px 18px 18px;
    max-width: 920px;
  }
  .check h3 { margin: 0 0 8px; font-size: 18px; }
  .opt {
    display: block;
    margin: 6px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button.act {
    background: var(--ink);
    color: var(--paper);
    border: 0;
    padding: 8px 14px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  button.act:disabled { background: #c8bfb2; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    padding: 8px 14px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  .msg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  .msg.ok { color: var(--ok); }
  .msg.bad { color: var(--accent); }
  .done-banner {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--ok-soft);
    max-width: 920px;
  }
  .reset {
    margin: 22px 8px 0;
    background: transparent;
    color: var(--side-dim);
    border: 0;
    padding: 0;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    text-decoration: underline;
  }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    aside { position: relative; height: auto; max-height: 240px; }
    .split { grid-template-columns: 1fr; }
    main { padding: 20px 16px 64px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <p class="brand">Çalışma masası</p>
    <h1>Kuantum hesaplama, sıfırdan</h1>
    <div class="meter">
      <span id="count">0 / 0 ders</span>
      <div class="bar"><span id="fill"></span></div>
    </div>
    <div id="nav"></div>
    <p class="brand" style="margin-top:18px"><a href="notes.html" style="color:#e7c2ae">Eğitim notları</a></p>
    <button class="reset" id="reset" type="button">İlerlemeyi sıfırla</button>
  </aside>
  <main id="stage"></main>
</div>
<script src="course.js"></script>
<script>
const KEY = "classiq-qc-course-v1";
const state = load();
let current = firstOpen();
let player = null;
let ticker = null;
let apiReady = false;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { done: {} }; }
  catch (e) { return { done: {} }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function flat() {
  const out = [];
  COURSE.modules.forEach(m => m.lessons.forEach(l => out.push(l)));
  return out;
}
function openLessons() { return flat().filter(l => l.cues); }
function isDone(id) { return !!state.done[id]; }
function unlocked(lesson) {
  if (!lesson.cues) return false;
  const seq = openLessons();
  const i = seq.findIndex(l => l.id === lesson.id);
  if (i <= 0) return true;
  return isDone(seq[i - 1].id);
}
function firstOpen() {
  const seq = openLessons();
  return seq.find(l => unlocked(l) && !isDone(l.id)) || seq.find(l => unlocked(l)) || seq[0];
}

function fmt(t) {
  if (t == null) return "";
  const s = Math.floor(t);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function renderNav() {
  const seq = openLessons();
  const doneN = seq.filter(l => isDone(l.id)).length;
  document.getElementById("count").textContent = doneN + " / " + seq.length + " ders";
  document.getElementById("fill").style.width = (seq.length ? (100 * doneN / seq.length) : 0) + "%";
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  COURSE.modules.forEach(mod => {
    const label = document.createElement("div");
    label.className = "mod-label";
    label.textContent = mod.title;
    nav.appendChild(label);
    mod.lessons.forEach(lesson => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "lesson-btn" + (lesson.id === current.id ? " active" : "") + (isDone(lesson.id) ? " done" : "");
      const open = unlocked(lesson);
      b.disabled = !open;
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = isDone(lesson.id) ? "✓" : "";
      const box = document.createElement("span");
      const title = document.createElement("div");
      title.className = "ltitle";
      title.textContent = lesson.title;
      const meta = document.createElement("div");
      meta.className = "lmeta";
      meta.textContent = open ? lesson.meta : "Kilitli · transkript sırada";
      box.appendChild(title);
      box.appendChild(meta);
      b.appendChild(mark);
      b.appendChild(box);
      b.addEventListener("click", () => { if (unlocked(lesson)) show(lesson.id); });
      nav.appendChild(b);
    });
  });
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function show(id) {
  if (ticker) { clearInterval(ticker); ticker = null; }
  player = null;
  current = flat().find(l => l.id === id);
  renderNav();
  const stage = document.getElementById("stage");
  const lesson = current;
  const links = (lesson.links || []).map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  const media = lesson.video
    ? `<div class="watch"><div class="frame"><div id="player"></div></div><div class="now" aria-live="polite"><p class="now-en" id="now-en"></p><p class="now-tr" id="now-tr"></p></div></div>`
    : `<div class="reading"><p>${esc(lesson.reading)}</p></div>`;
  const note = lesson.note ? `<div class="note">${esc(lesson.note)}</div>` : "";
  const cues = lesson.cues.map((c, i) => {
    const stamp = c.t == null ? "" : fmt(c.t);
    const en = `<div class="cue" data-i="${i}"><time>${stamp}</time><div>${esc(c.en)}</div></div>`;
    const tr = `<div class="cue" data-i="${i}"><time>${stamp}</time><div>${esc(c.tr)}</div></div>`;
    return [en, tr];
  });
  const finished = openLessons().every(l => isDone(l.id));
  stage.innerHTML = `
    <p class="kicker">${esc(lesson.kicker)}</p>
    <h2>${esc(lesson.title)}</h2>
    <p class="lead">${esc(lesson.lead)}</p>
    <div class="sources">${links}</div>
    ${media}
    ${note}
    <details class="full"${lesson.video ? "" : " open"}>
      <summary>Tüm metin, satır satır</summary>
    <div class="split">
      <section class="col">
        <h3>İngilizce</h3>
        <div id="en">${cues.map(p => p[0]).join("")}</div>
      </section>
      <section class="col">
        <h3>Türkçe</h3>
        <div id="tr">${cues.map(p => p[1]).join("")}</div>
      </section>
    </div>
    </details>
    <form class="check" id="quiz">
      <h3>Geçiş</h3>
      <p>${esc(lesson.quiz.q)}</p>
      ${lesson.quiz.options.map((o, i) => `<label class="opt"><input type="radio" name="a" value="${i}" /> ${esc(o)}</label>`).join("")}
      <div class="row">
        <button class="act" id="finish" type="submit" ${isDone(lesson.id) ? "disabled" : ""}>${isDone(lesson.id) ? "Tamamlandı" : "Dersi tamamla"}</button>
        <span class="msg" id="msg"></span>
      </div>
    </form>
    ${finished ? `<div class="done-banner">${COURSE.doneNote}</div>` : ""}
  `;
  stage.querySelectorAll(".cue").forEach(el => {
    el.addEventListener("click", () => {
      const i = Number(el.dataset.i);
      const t = lesson.cues[i].t;
      document.querySelectorAll(".cue").forEach(n => n.classList.toggle("active", Number(n.dataset.i) === i));
      setNow(i);
      if (player && t != null && player.seekTo) player.seekTo(t, true);
    });
  });
  stage.querySelector("#quiz").addEventListener("submit", ev => {
    ev.preventDefault();
    const picked = stage.querySelector("input[name=a]:checked");
    const msg = document.getElementById("msg");
    if (!picked) { msg.className = "msg bad"; msg.textContent = "Bir şık seç."; return; }
    if (Number(picked.value) !== lesson.quiz.answer) {
      msg.className = "msg bad";
      msg.textContent = lesson.quiz.why;
      return;
    }
    state.done[lesson.id] = true;
    save();
    msg.className = "msg ok";
    msg.textContent = "Tamam. Sonraki ders açıldı.";
    document.getElementById("finish").disabled = true;
    document.getElementById("finish").textContent = "Tamamlandı";
    renderNav();
    if (openLessons().every(l => isDone(l.id))) show(lesson.id);
  });
  setNow(0);
  mountPlayer(lesson);
}

function setNow(idx) {
  const c = current.cues[idx];
  const en = document.getElementById("now-en");
  const tr = document.getElementById("now-tr");
  if (!c || !en || !tr) return;
  en.textContent = c.en;
  tr.textContent = c.tr;
}

function mountPlayer(lesson) {
  if (ticker) { clearInterval(ticker); ticker = null; }
  if (!lesson.video) { player = null; return; }
  const boot = () => {
    if (player && player.loadVideoById) {
      player.loadVideoById(lesson.video);
      return;
    }
    player = new YT.Player("player", {
      videoId: lesson.video,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1, cc_lang_pref: "en", cc_load_policy: 1 },
      events: { onReady: () => track(), onStateChange: () => track() }
    });
  };
  if (window.YT && YT.Player) boot();
  else {
    window.onYouTubeIframeAPIReady = () => { apiReady = true; mountPlayer(current); };
    if (!document.getElementById("ytapi")) {
      const s = document.createElement("script");
      s.id = "ytapi";
      s.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(s);
    }
  }
  track();
}

function track() {
  if (ticker) clearInterval(ticker);
  ticker = setInterval(() => {
    if (!player || !player.getCurrentTime || !current.video) return;
    const t = player.getCurrentTime();
    let idx = 0;
    current.cues.forEach((c, i) => { if (c.t != null && c.t <= t + 0.25) idx = i; });
    setNow(idx);
    document.querySelectorAll(".cue").forEach(n => n.classList.toggle("active", Number(n.dataset.i) === idx));
  }, 400);
}

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("İşaretler silinsin mi?")) return;
  state.done = {};
  save();
  current = firstOpen();
  show(current.id);
});

show(current.id);
</script>
</body>
</html>
